site_name: Fffffx's Note
site_author: Fffffx
site_description: 可达鸭的笔记本，记录了 ZJU-CS 的一些课程笔记。
repo_url: https://github.com/Fffffx0618/PsyBlog
repo_name: Fffffx

use_directory_urls: false

theme:
  name: material
  variant: classic
  language: zh
  html_sanitizer: false
  features:
    - content.math
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.path
    - navigation.prune
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.share
    - search.suggest
    - search.highlight
    - toc.follow

  font:
    text: LXGW WenKai Screen, Microsoft YaHei, sans-serif
    code: JetBrains Mono, Sarasa Mono SC, Consolas, monospace

  icon:
    repo: fontawesome/brands/github
    logo: material/notebook-edit-outline
    previous: fontawesome/solid/angle-left
    next: fontawesome/solid/angle-right
    admonition:
      note: material/pencil-outline
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/squirrel-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue-grey
      accent: blue-grey
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue-grey
      accent: teal
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

  favicon: assets/icon.png
markdown_extensions:
  - nl2br             # 保留笔记中的段内换行；块之间仍需空行
  - tables
  - sane_lists
  - md_in_html        # 支持在 HTML 中写 MD，提高兼容性
  - footnotes
  - attr_list
  - def_list
  - admonition
  - pymdownx.details
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.magiclink # 自动链接转换
  - pymdownx.arithmatex:
      generic: true
      smart_dollar: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
      
plugins:
  - search

extra_javascript:
  - javascripts/lazy-renderers.js

extra_css:
  - https://gcore.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.1.0/style.css
  - https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap
  - stylesheets/blueTopaz.css
  - stylesheets/extra.css

  


